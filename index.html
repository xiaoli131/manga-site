<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的漫画屋</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #222;
    color: white;
    padding: 18px 15px;
    text-align: center;
}

header h1 {
    margin: 0 0 12px;
    font-size: 25px;
}

.search {
    width: 90%;
    max-width: 500px;
    padding: 12px;
    border: none;
    border-radius: 20px;
    font-size: 16px;
}

nav {
    background: white;
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

nav a {
    margin: 0 10px;
    color: #333;
    text-decoration: none;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px 12px;
}

.title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.manga-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.manga {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.manga img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.manga-info {
    padding: 12px;
}

.manga h3 {
    margin: 0 0 6px;
    font-size: 17px;
}

.manga p {
    margin: 0;
    color: #777;
    font-size: 14px;
}

.read {
    display: block;
    margin-top: 10px;
    background: #222;
    color: white;
    text-align: center;
    padding: 9px;
    border-radius: 6px;
    text-decoration: none;
}

footer {
    margin-top: 30px;
    padding: 25px;
    text-align: center;
    background: #222;
    color: white;
}

@media (min-width: 700px) {
    .manga-list {
        grid-template-columns: repeat(4, 1fr);
    }

    .manga img {
        height: 280px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 我的漫画屋</h1>
    <input
        class="search"
        type="text"
        placeholder="搜索漫画..."
        onkeyup="searchManga()"
        id="search"
    >
</header>

<nav>
    <a href="#">首页</a>
    <a href="#">最新</a>
    <a href="#">热门</a>
    <a href="#">分类</a>
</nav>

<div class="container">

    <div class="title">🔥 最新漫画</div>

    <div class="manga-list" id="mangaList">

        <div class="manga">
            <img src="https://picsum.photos/400/600?random=1">
            <div class="manga-info">
                <h3>漫画作品一</h3>
                <p>更新至第 10 话</p>
                <a class="read" href="#">开始阅读</a>
            </div>
        </div>

        <div class="manga">
            <img src="https://picsum.photos/400/600?random=2">
            <div class="manga-info">
                <h3>漫画作品二</h3>
                <p>更新至第 25 话</p>
                <a class="read" href="#">开始阅读</a>
            </div>
        </div>

        <div class="manga">
            <img src="https://picsum.photos/400/600?random=3">
            <div class="manga-info">
                <h3>漫画作品三</h3>
                <p>更新至第 8 话</p>
                <a class="read" href="#">开始阅读</a>
            </div>
        </div>

        <div class="manga">
            <img src="https://picsum.photos/400/600?random=4">
            <div class="manga-info">
                <h3>漫画作品四</h3>
                <p>更新至第 16 话</p>
                <a class="read" href="#">开始阅读</a>
            </div>
        </div>

    </div>
</div>

<footer>
    © 2026 我的漫画屋
</footer>

<script>
function searchManga() {
    let keyword = document
        .getElementById("search")
        .value
        .toLowerCase();

    let mangas = document.querySelectorAll(".manga");

    mangas.forEach(function(manga) {
        let name = manga
            .querySelector("h3")
            .innerText
            .toLowerCase();

        if (name.includes(keyword)) {
            manga.style.display = "";
        } else {
            manga.style.display = "none";
        }
    });
}
</script>

</body>
</html>
